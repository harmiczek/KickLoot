<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 240px; background: #1C1D21; color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; text-align: center; }
    .accent { color: #53F700; }
    h2 { margin: 0 0 15px 0; font-size: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .img-container { min-height: 50px; display: flex; justify-content: center; align-items: center; margin: 15px 0; }
    img { max-width: 100px; height: auto; border-radius: 4px; filter: drop-shadow(0 0 8px rgba(83,247,0,0.3)); }
    .status-text { font-size: 14px; line-height: 1.4; color: #E0E0E0; }
    .big-number { font-size: 24px; font-weight: bold; color: #FF9900; }
  </style>
</head>
<body>
  <h2>Kick<span class="accent">Loot</span></h2>
  <div id="content" class="status-text">Loading data from Kick.com...</div>
  <script src="popup.js"></script>
</body>
</html>
